name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Auto-fix Permissions & Create Required Files
        run: |
          # 1. إعطاء صلاحيات التشغيل لـ gradlew لو كان موجوداً
          if [ -f "./gradlew" ]; then chmod +x ./gradlew; fi

          # 2. إنشاء مجلد app وتوفير google-services.json وهمي
          mkdir -p app/src/debug app/src/main
          DUMMY_JSON='{"project_info":{"project_number":"0","project_id":"dummy","storage_bucket":"dummy.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"com.example.app"}},"oauth_client":[],"api_key":[{"current_key":"dummy"}],"services":{"analytics_service":{"status":1}}}]}'
          echo "$DUMMY_JSON" > app/google-services.json
          echo "$DUMMY_JSON" > app/src/debug/google-services.json

      - name: Generate Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Build APK with Gradle
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Djava.awt.headless=true -Xmx4g -XX:MaxMetaspaceSize=1g"
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace --info
          else
            gradle assembleDebug --stacktrace --info
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
